<button mat-icon-button aria-label="Add notes" (click)="openNotes()">
  @if (recommendationNotes$ | async; as notes) {
    <mat-icon
      color="primary"
      matBadgeColor="warn"
      matBadge="{{ notes.length }}"
      [matBadgeHidden]="notes.length === 0"
      >
      speaker_notes
    </mat-icon>
  } @else {
    <mat-icon color="primary">speaker_notes</mat-icon>
  }

</button>
