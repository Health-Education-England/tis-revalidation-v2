<app-nav-bar></app-nav-bar>
<ng-container>
  @if ({ isHandset: isHandset$ | async }; as device) {
    <div class="record-details" [ngClass]="{ 'd-flex': !device.isHandset }">
      @if (!device.isHandset) {
        <div class="left-nav">
          <app-details-side-nav></app-details-side-nav>
        </div>
      }
      @if (!device.isHandset) {
        <mat-divider [vertical]="true"></mat-divider>
      }
      @if ({
        ishandset: device.isHandset
        }; as toolbarSettings) {
        <div
          class="main-col d-grid align-content-start bg-white"
          >
          <app-tool-bar></app-tool-bar>
          <mat-drawer-container class="notes-drawer-container">
            <mat-drawer
              #notesDrawer
              [mode]="toolbarSettings.ishandset ? 'over' : 'side'"
              position="end"
              [opened]="isOpen$ | async"
              >
              <app-notes-drawer></app-notes-drawer>
            </mat-drawer>
            <mat-drawer-content>
              <div class="record-content-container">
                <router-outlet></router-outlet>
              </div>
            </mat-drawer-content>
          </mat-drawer-container>
        </div>
      }
    </div>
  }
</ng-container>
