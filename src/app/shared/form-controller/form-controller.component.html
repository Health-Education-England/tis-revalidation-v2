@if (!hidden && form) {
  <div [formGroup]="form">
    @switch (control?.controlType) {
      @case (formControlType.CHECKBOX) {
        <app-material-checkbox
          [controlProperties]="control"
          [formControlName]="control.key"
          >
        </app-material-checkbox>
      }
      @case (formControlType.SELECTION_LIST) {
        <app-material-selection-list
          [controlProperties]="control"
          [formControlName]="control.key"
        ></app-material-selection-list>
      }
      @case (formControlType.AUTOCOMPLETE) {
        <app-material-autocomplete
          [controlProperties]="control"
          [formControlName]="control.key"
          >
        </app-material-autocomplete>
      }
      @case (formControlType.DATERANGE) {
        <app-material-date-range-picker
          [controlProperties]="control"
          [formControlName]="control.key"
          >
        </app-material-date-range-picker>
      }
    }
  </div>
}
