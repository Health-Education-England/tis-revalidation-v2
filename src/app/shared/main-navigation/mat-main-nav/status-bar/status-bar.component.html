<button
  mat-icon-button
  [matMenuTriggerFor]="statusMenu"
  aria-label="Application status menu"
  >
  <mat-icon>more_vert</mat-icon>
</button>
<mat-menu #statusMenu="matMenu">
  <button mat-menu-item>
    <mat-icon>person</mat-icon>
    <span>{{ username }}</span>
  </button>

  <button mat-menu-item>
    @if (serviceSeverity === 3) {
      <mat-icon class="severity-none"
        >fiber_manual_record</mat-icon
        >
      }
      @if (serviceSeverity === 2) {
        <mat-icon class="severity-low"
          >warning</mat-icon
          >
        }
        @if (serviceSeverity === 1) {
          <mat-icon class="severity-medium"
            >warning</mat-icon
            >
          }
          @if (serviceSeverity === 0) {
            <mat-icon class="severity-high"
              >error</mat-icon
              >
            }
            <span>System status</span>
          </button>

          <a mat-menu-item [href]="helpLink" target="_blank">
            <mat-icon class="help">live_help</mat-icon>
            <span>Get help</span>
          </a>

          @if (notificationsCount === 0) {
            <button mat-menu-item disabled>
              <mat-icon>notifications_off</mat-icon>
              <span>Notifications</span>
            </button>
          }

          @if (notificationsCount > 0) {
            <button mat-menu-item>
              <mat-icon matBadge="{{ notificationsCount }}" color="primary"
                >notifications_active</mat-icon
                >
                <span>Notifications</span>
              </button>
            }

            <button mat-menu-item (click)="logOut()">
              <mat-icon>lock</mat-icon>
              <span>Logout</span>
            </button>
            <div class="version">version: {{ version }}</div>
          </mat-menu>
