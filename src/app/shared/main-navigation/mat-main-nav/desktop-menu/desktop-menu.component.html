@for (menuItem of menuItems; track menuItem) {
  @if (menuItem.menuItems) {
    <button
      mat-button
      [matMenuTriggerFor]="subMenu"
      (click)="setActiveItem(menuItem.name)"
      class="nav-item"
      [ngClass]="{ active: menuItem.name === activeItem }"
      >
      {{ menuItem.name }}
    </button>
    <mat-menu
      #subMenu="matMenu"
      [class]="menuItem.menuItems?.length > 5 ? 'mega-menu' : ''"
      >
      @for (item of menuItem.menuItems; track item) {
        @if (item.type === menuType.INTERNAL) {
          <a
            mat-menu-item
            [routerLink]="item.route"
            routerLinkActive="active-list-item"
            >{{ item.name }}</a
            >
          }
          @if (item.type === menuType.EXTERNAL) {
            <a
              mat-menu-item
              [href]="hostURI + item.route"
              >{{ item.name }}</a
              >
            }
          }
        </mat-menu>
      }
    }
