<div class="filters-wrapper">
  @if (form) {
    <form
      data-cy="tableFiltersForm"
      (ngSubmit)="onSubmit()"
      [formGroup]="form"
      >
      <div class="filter-form-header">
        <div class="d-flex justify-content-between">
          <h2 class="mb-0">Filters</h2>
          @if (tableFilters$ | async; as tableFilters) {
            <button
              color="primary"
              data-jasmine="clearFiltersButton"
              mat-button
              (click)="clearFilters()"
              >
              Clear all
            </button>
          }
        </div>
      </div>
      <div class="p-10 mb-20">
        @for (control of formControls; track control) {
          <div class="form-row">
            <app-form-controller
              [control]="control"
              [form]="form"
            ></app-form-controller>
          </div>
        }
      </div>
    </form>
  }
</div>
