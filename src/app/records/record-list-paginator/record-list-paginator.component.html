@if (totalResults$ | async; as totalResults) {
  <mat-paginator
    [length]="totalResults"
    [pageIndex]="pageIndex$ | async"
    [pageSize]="20"
    [hidePageSize]="true"
    (page)="paginate($event)"
    [disabled]="disablePaginator"
    [showFirstLastButtons]="true"
    >
  </mat-paginator>
}
